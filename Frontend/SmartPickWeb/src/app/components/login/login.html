<div class="login-container">
  <div class="login-box">
    <h2>SmartPick Web</h2>
    <p>Gestión de Rutas de Picking</p>
    
    <form>
      <div class="input-group">
        <label for="rut">RUT del Usuario</label>
        <input type="text" id="rut" name="rut" [(ngModel)]="rut" placeholder="Ej: 12.345.678-9" required>
      </div>
      
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Ingresa tu contraseña" required>
      </div>
      
      <button type="button" class="btn-login" (click)="iniciarSesion()">Iniciar Sesión</button>
    </form>
  </div>
</div>
